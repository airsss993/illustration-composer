<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор иллюстраций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f0ef; --surface: #f8f8f6; --ink: #0f0e12; --ink-2: #45444a; --label: #6f6e73;
  --line: #d6d5d1; --line-strong: #0f0e12; --signal: #e8501c; --signal-tint: rgba(232, 80, 28, .10); --signal-ink: #fff;
  --bad: #b81d13; --ok: #0d6b3a;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141413; --surface: #1c1c1a; --ink: #edece7; --ink-2: #c3c2bc; --label: #95948e;
  --line: #34332f; --line-strong: #edece7; --signal: #ff6a35; --signal-tint: rgba(255, 106, 53, .14); --signal-ink: #141413;
  --bad: #ff7b6e; --ok: #5fd08e; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); }
.app { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 100vh; }
aside { border-right: 1px solid var(--line-strong); padding: 16px; display: grid; gap: 18px; align-content: start; overflow-y: auto; max-height: 100vh; }
h1 { font: 600 20px/1.2 var(--sans); margin: 0; }
.k { font: 500 13px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--label); }
fieldset { border: 0; border-top: 1px solid var(--line); padding: 12px 0 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
legend { padding: 0 8px 0 0; }
label { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
input, select, button { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 7px 9px; min-width: 0; }
input[type=range] { padding: 0; }
button { cursor: pointer; }
button:hover { border-color: var(--ink); }
button.main { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lib { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lib button { padding: 4px; aspect-ratio: 1; display: grid; place-items: center; }
.lib svg { width: 100%; height: 100%; }
#status { font-size: 14px; min-height: 1.4em; margin: 0; color: var(--ink-2); }
#status.err { color: var(--bad); }
.layers { display: grid; gap: 2px; list-style: none; margin: 0; padding: 0; }
.layers button { width: 100%; text-align: left; font: 500 14px var(--mono); border-color: transparent; background: transparent; }
.layers button[aria-current=true] { border-color: var(--signal); background: var(--signal-tint); }
main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
.bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#stage { padding: 24px; display: grid; place-items: center; min-height: 0; touch-action: none; }
#stage svg { max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; background: var(--surface); box-shadow: 0 0 0 1px var(--line); user-select: none; }
#stage g[data-i] { cursor: grab; }
#selected:disabled { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line-strong); max-height: none; order: 2; }
  main { order: 1; }
  #stage { padding: 16px; }
  #stage svg { max-height: 70vh; }
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div><div class="k">сборка из библиотеки</div><h1>Конструктор иллюстраций</h1></div>

  <fieldset>
    <legend class="k">По метафоре или заголовку</legend>
    <form id="byMetaphor" class="row">
      <input name="q" placeholder="Финансовая грамотность для студентов" aria-label="Метафора или заголовок" style="flex:3 1 0">
      <button class="main">Собрать</button>
    </form>
  </fieldset>

  <fieldset>
    <legend class="k">По названиям объектов</legend>
    <form id="byNames" class="row">
      <input name="q" placeholder="лампа, кошелёк, монета" aria-label="Названия объектов" style="flex:3 1 0">
      <button class="main">Собрать</button>
    </form>
  </fieldset>

  <p id="status" role="status"></p>

  <fieldset>
    <legend class="k">Холст</legend>
    <div class="grid3">
      <label>Формат<select id="format"></select></label>
      <label>Набор<select id="size"><option value="L">L, подробный</option><option value="S">S, упрощённый</option></select></label>
      <label>Фон<select id="background"><option value="lines">линии</option><option value="confetti">конфетти</option><option value="none">без фона</option></select></label>
    </div>
    <div class="row">
      <label style="flex:2 1 0">Цветовая схема<select id="scheme"></select></label>
      <label style="flex:1 1 0">Своя палитра<input id="palette" type="file" accept=".json,application/json"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend class="k">Добавить объект</legend>
    <div class="lib" id="lib"></div>
  </fieldset>

  <fieldset id="selected" disabled>
    <legend class="k">Выбранный объект</legend>
    <label>Поворот, градусы <input id="rotation" type="range" min="-180" max="180" step="1"></label>
    <div class="row">
      <button type="button" data-act="state">Главный / фоновый</button>
      <button type="button" data-act="dup">Дублировать</button>
      <button type="button" data-act="del">Удалить</button>
    </div>
    <div class="row">
      <button type="button" data-act="up">Слой выше</button>
      <button type="button" data-act="down">Слой ниже</button>
    </div>
  </fieldset>

  <fieldset>
    <legend class="k">Слои, верхний первым</legend>
    <ul class="layers" id="layers"></ul>
  </fieldset>
</aside>
<main>
  <div class="bar">
    <span class="k" id="info"></span>
    <button class="main" id="export">Скачать SVG</button>
  </div>
  <div id="stage"></div>
</main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
